[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echopage"
version = "0.1.0"
description = "Add synced audio narration to EPUBs"
requires-python = ">=3.10"
dependencies = ["lxml", "beautifulsoup4", "nltk"]

[project.optional-dependencies]
dev = ["pytest"]
align = ["whisperx"]

[project.scripts]
echopage = "echopage.cli:main"

[tool.setuptools]
packages = ["echopage"]
